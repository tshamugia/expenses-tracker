<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — ExtraTracker</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #0f1419;
        padding: 24px;
        text-align: center;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0f1419;
          color: #f8fafc;
        }
      }
      .card {
        max-width: 360px;
      }
      .icon {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: #1a1f35;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        margin: 0 auto 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        opacity: 0.7;
        line-height: 1.5;
        font-size: 14px;
      }
      button {
        appearance: none;
        border: none;
        cursor: pointer;
        background: #1a1f35;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 10px;
      }
      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">💰</div>
      <h1>You're offline</h1>
      <p>ExtraTracker can't reach the network right now. Check your connection and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
