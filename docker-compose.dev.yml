version: '3.8'

services:
  db:
    image: postgres:17-alpine
    container_name: extracker-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=extracker
      - POSTGRES_PASSWORD=extracker
      - POSTGRES_DB=extracker
    ports:
      # Host 5433 -> container 5432 (5432 is used by another local project)
      - "5433:5432"
    volumes:
      - extracker-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U extracker -d extracker"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - extracker-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        - NODE_ENV=development
    container_name: extracker-dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for hot reload
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Database (containerized app talks to the db service over the compose network)
      - DATABASE_URL=postgresql://extracker:extracker@db:5432/extracker
      - DIRECT_URL=postgresql://extracker:extracker@db:5432/extracker

      # Auth
      - AUTH_SECRET=${AUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}

      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Email (Resend)
      - RESEND_API_KEY=${RESEND_API_KEY}

      # Cron
      - CRON_SECRET=${CRON_SECRET}

      # Node environment
      - NODE_ENV=development
    networks:
      - extracker-network

networks:
  extracker-network:
    driver: bridge

volumes:
  extracker-db-data:
