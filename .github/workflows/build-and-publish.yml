name: Build & Publish

# Builds the Docker image, publishes it to GHCR, then triggers a Railway
# redeploy (which re-pulls the pinned image tag and runs `prisma migrate deploy`
# as the pre-deploy command before the new version starts).

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/extracker

jobs:
  # ── 1. Quality gate ────────────────────────────────────────────────
  verify:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        run: npx prisma generate

      # Lint is non-blocking: the repo has pre-existing lint debt (23 errors)
      # unrelated to deployment. Findings stay visible; they don't block deploys.
      # Typecheck below IS the hard gate. See implementation.md.
      - name: Lint (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # NOTE: this project has no automated test suite yet. The "test" step is
      # intentionally a documented no-op — add `npm test` here once tests exist.
      - name: Test (none present)
        run: echo "No test suite in this repo yet — skipping. See implementation.md."

  # ── 2. Build image + publish to GHCR ───────────────────────────────
  build-and-push:
    name: Build & Push (GHCR)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

  # ── 3. Trigger Railway redeploy (re-pulls the new image) ───────────
  deploy:
    name: Deploy (Railway)
    needs: build-and-push
    runs-on: ubuntu-latest
    # Skips until RAILWAY_SERVICE_NAME repo variable is set (bootstrap-safe: the
    # first push just builds the image; enable auto-deploy by setting the var).
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.RAILWAY_SERVICE_NAME != ''
    steps:
      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Redeploy service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway redeploy --service "${{ vars.RAILWAY_SERVICE_NAME }}" --yes
